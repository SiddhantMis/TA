name: Validate private scanner tracker

on:
  pull_request:
    branches: [main]
    paths:
      - "scanner_tracker/**"
      - "migrations/**"
      - "tests/**"
      - "app.py"
      - "alembic.ini"
      - "requirements.txt"
      - "analyzer.py"
      - "alerts.py"
      - "backtest.py"
      - "main.py"
      - "leaders.py"
      - "research.py"
      - "test_patterns.py"
      - "test_momentum_portfolio.py"
      - ".streamlit/config.toml"
      - ".github/workflows/tracker-validate.yml"
      - ".github/workflows/tracker-eod.yml"
  push:
    branches: [main, codex/scanner-tracker]
    paths:
      - "scanner_tracker/**"
      - "migrations/**"
      - "tests/**"
      - "app.py"
      - "alembic.ini"
      - "requirements.txt"
      - "analyzer.py"
      - "alerts.py"
      - "backtest.py"
      - "main.py"
      - "leaders.py"
      - "research.py"
      - "test_patterns.py"
      - "test_momentum_portfolio.py"
      - ".streamlit/config.toml"
      - ".github/workflows/tracker-validate.yml"
      - ".github/workflows/tracker-eod.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tracker-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-and-database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tracker
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TRACKER_ENV: test
      DATABASE_URL: sqlite:///.local/validation.db
      DATABASE_TEST_URL: postgresql+psycopg://tracker:tracker@localhost:5432/tracker?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install verified dependencies
        run: |
          python -m pip install -r requirements.txt pytest==9.0.1
          python -m pip check
      - name: Validate additive migration and retry
        run: |
          python -m scanner_tracker migrate
          python -m scanner_tracker migrate
      - name: Run existing and tracker regression tests
        run: python -m pytest -q test_patterns.py test_momentum_portfolio.py tests --ignore=tests/test_tracker_ui.py
      - name: Exercise Streamlit AppTest without provider accounts
        run: python -m pytest -q tests/test_tracker_ui.py
      - name: Compile application and legacy integration modules
        run: >-
          python -m compileall -q scanner_tracker migrations tests app.py
          analyzer.py alerts.py backtest.py leaders.py main.py
          momentum_portfolio.py portfolio.py research.py
