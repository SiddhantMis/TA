name: Leaders check

# Branch-only live check of the wide-universe leaders scan (no Discord, nothing published to Pages).
# Commits results/leaders_preview.json back to the branch so it can be reviewed without downloading artifacts.
on:
  push:
    branches: [tool-v1]
    paths: ['leaders.py', '.github/workflows/leaders-check.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  leaders:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python test_patterns.py
      - name: Run wide leaders scan
        run: python leaders.py --out results/leaders_preview.json
      - name: Commit preview back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/leaders_preview.json
          git commit -m "Leaders preview [skip ci]" || echo "nothing to commit"
          git push
