name: Backtest

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history"
        default: "5"
      max_hold:
        description: "Time stop (sessions after fill)"
        default: "15"
      cost_pct:
        description: "Round-trip costs, % of price"
        default: "0.25"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python test_patterns.py
      - name: Run backtest
        run: python backtest.py --years ${{ inputs.years }} --max-hold ${{ inputs.max_hold }} --cost-pct ${{ inputs.cost_pct }}
      - name: Show report in the run summary
        run: cat backtest_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: |
            backtest_trades.csv
            backtest_report.md
