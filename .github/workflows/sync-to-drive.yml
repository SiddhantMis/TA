name: Sync repository snapshots to Google Drive

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-drive
  cancel-in-progress: false

jobs:
  sync:
    # PR #9 targets the research branch, so do not restrict the event to PRs targeting main.
    # Only the two requested PRs are allowed to start a privileged pull_request_target run.
    if: ${{ github.event_name != 'pull_request_target' || contains(fromJSON('[8,9]'), github.event.pull_request.number) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch requested pull request heads
        run: |
          git fetch origin main pull/8/head:refs/heads/pr-8 pull/9/head:refs/heads/pr-9

      - name: Prepare clean branch snapshots and manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/TA_Sync
          mkdir -p /tmp/TA_Sync/main /tmp/TA_Sync/pr-8 /tmp/TA_Sync/pr-9

          for ref in main pr-8 pr-9; do
            case "$ref" in
              main) destination="/tmp/TA_Sync/main" ;;
              pr-8) destination="/tmp/TA_Sync/pr-8" ;;
              pr-9) destination="/tmp/TA_Sync/pr-9" ;;
            esac
            git archive --format=tar "$ref" |
              tar -xf - -C "$destination" \
                --exclude='__pycache__' \
                --exclude='*/__pycache__' \
                --exclude='*/__pycache__/*'
          done

          {
            echo "# TA repository sync manifest"
            echo
            echo "- Sync time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- Sync time (IST): $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S %Z')"
            echo
            echo "## Snapshot revisions"
            echo
            for entry in "main:main" "pr-8:PR #8 (codex/scanner-tracker)" "pr-9:PR #9 (codex/research-action-quarantine)"; do
              ref="${entry%%:*}"
              label="${entry#*:}"
              echo "### $label"
              echo
              echo "- Ref: `$ref`"
              echo "- Commit SHA: `$(git rev-parse "$ref")`"
              echo "- Commit message:"
              echo
              git log -1 --format='%B' "$ref" | sed 's/^/  /'
              echo
            done
            echo "## Diff statistics against main"
            echo
            echo "### main...pr-8"
            echo
            echo ' ```text'
            git diff --stat main...pr-8 || true
            echo ' ```'
            echo
            echo "### main...pr-9"
            echo
            echo ' ```text'
            git diff --stat main...pr-9 || true
            echo ' ```'
          } > /tmp/TA_Sync/SYNC_MANIFEST.md

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install --yes rclone

      - name: Sync snapshots to Google Drive
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RCLONE_CONFIG:-}" ]]; then
            echo "::error::The RCLONE_CONFIG repository secret is not configured."
            exit 1
          fi
          install -d -m 700 "$HOME/.config/rclone"
          umask 077
          printf '%s' "$RCLONE_CONFIG" > "$HOME/.config/rclone/rclone.conf"
          rclone mkdir gdrive:TA_Sync/outbox

          # Do not combine --exclude with --delete-excluded: rclone would delete
          # the excluded destination outbox. Ordinary sync preserves excluded files.
          rclone sync /tmp/TA_Sync gdrive:TA_Sync --exclude "/outbox/**" --create-empty-src-dirs
