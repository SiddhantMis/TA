name: EOD Stock Screener

on:
  schedule:
    # Three attempts per trading day, ~2.5 hours apart. Each attempt scans only if the expected session's data is
    # available AND that session has not been published yet; otherwise it saves nothing and the next attempt retries.
    - cron: '30 13 * * 1-5'   # 13:30 UTC = 7:00 PM IST
    - cron: '0 16 * * 1-5'    # 16:00 UTC = 9:30 PM IST
    - cron: '30 18 * * 1-5'   # 18:30 UTC = 12:00 AM IST (the LAST attempt: only this one sends a failure message)
  workflow_dispatch:
    inputs:
      force_rerun:
        description: Re-run even if this session is already published
        type: boolean
        default: false

concurrency:
  group: eod-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pattern detection tests
        run: python test_patterns.py

      - name: Run screener
        id: screen
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FINAL_ATTEMPT: ${{ github.event.schedule == '30 18 * * 1-5' }}
          FORCE_RERUN: ${{ inputs.force_rerun }}
        run: |
          set +e
          python main.py
          code=$?
          if [ "$code" -eq 75 ]; then
            # Exit 75 = the expected session's data is not available yet. Nothing was saved or published; a later
            # scheduled attempt retries. This is deliberately NOT a red run.
            echo "not_ready=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Expected session data not ready - nothing saved. A later attempt will retry."
            exit 0
          fi
          exit $code

      - name: Commit results to docs/
        if: steps.screen.outputs.not_ready != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # This run's own computed output, saved OUTSIDE the git working
          # tree before any retry loop touches it. A concurrent run (the
          # scheduled trigger and a manual one overlapping is a real,
          # recurring scenario) writes different market data to the same
          # file path -- that's not a mergeable diff, it's two different
          # snapshots, and a rebase/merge attempt WILL hit a genuine
          # content conflict (verified this by simulating the collision
          # locally before writing this: a plain rebase-retry reliably
          # failed with "CONFLICT (content)" on exactly this file, so it
          # doesn't just theoretically apply here). On rejection: reset to
          # whatever the winning run pushed, then re-apply THIS run's
          # output on top -- never attempt to reconcile the two.
          cp docs/latest_screen.json /tmp/this_run_output.json
          cp docs/scorecard.json /tmp/this_run_scorecard.json 2>/dev/null || true
          rm -rf /tmp/this_run_history && mkdir -p /tmp/this_run_history
          cp -r docs/history/. /tmp/this_run_history/ 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            cp /tmp/this_run_output.json docs/latest_screen.json
            [ -f /tmp/this_run_scorecard.json ] && cp /tmp/this_run_scorecard.json docs/scorecard.json
            mkdir -p docs/history && cp -r /tmp/this_run_history/. docs/history/ 2>/dev/null || true
            git add docs/latest_screen.json docs/scorecard.json docs/history 2>/dev/null || git add docs/latest_screen.json
            if git diff --staged --quiet; then
              echo "no changes to commit"
              exit 0
            fi
            git commit -q -m "Update screen results [skip ci]"
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) -- another run committed first. Resetting to latest main and re-applying this run's output, not merging."
            git fetch origin main
            git reset -q --hard origin/main
            sleep $((attempt * 3))
          done
          echo "push failed after 5 attempts"
          exit 1

      - name: Upload results as artifact too
        if: always() && steps.screen.outputs.not_ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: latest-screen
          path: |
            docs/latest_screen.json
            docs/scorecard.json