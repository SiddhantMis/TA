name: Research

# Runs on every push to the experiments branch (and by hand). Results are committed
# back to the same branch under results/ so they can be read without downloading artifacts.
on:
  push:
    branches: [experiments]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data_cache
          key: frames-v1-${{ github.run_id }}
          restore-keys: |
            frames-v1-
      - run: python test_patterns.py
      - name: Run pattern lab
        run: python pattern_lab.py --years 10 --liquid-top 200 --oos-frac 0.35 --cost-pct 0.30
      - name: Show report in the run summary
        run: cat results/pattern_lab_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "Pattern lab results [skip ci]" || echo "nothing to commit"
          git push
